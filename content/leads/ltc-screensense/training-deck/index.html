<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 7-Layer Privacy Stack — A Briefing for California Schools</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  font-family: 'Times New Roman', serif;
  background: #2a2620;
  color: #f4ecd8;
  overflow: hidden;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slide-frame {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
  background: #f4ecd8;
}

.slide-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(30, 26, 22, 0.88);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(244, 236, 216, 0.10);
  z-index: 10;
  font-size: 13px;
  letter-spacing: 1.5px;
}
.top-bar .brand { font-weight: 700; color: #8a9e7e; }
.top-bar .meta { color: #b9a98a; font-size: 12px; letter-spacing: 2px; }

.nav-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(30, 26, 22, 0.88);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(244, 236, 216, 0.10);
  z-index: 10;
}
.nav-btn {
  background: transparent;
  color: #f4ecd8;
  border: 1px solid rgba(244, 236, 216, 0.20);
  padding: 10px 18px;
  border-radius: 6px;
  font-family: 'Times New Roman', serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.nav-btn:hover {
  background: rgba(244, 236, 216, 0.08);
  border-color: rgba(244, 236, 216, 0.45);
}
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.nav-counter { font-size: 13px; color: #b9a98a; letter-spacing: 2px; }
.nav-counter strong { color: #c5694e; font-weight: 700; font-size: 16px; }

.thumbs {
  position: fixed;
  top: 70px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  padding: 8px 4px;
  scrollbar-width: thin;
}
.thumb {
  width: 90px;
  height: 51px;
  border-radius: 4px;
  border: 2px solid transparent;
  background-size: cover;
  background-position: center;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.thumb:hover { opacity: 0.9; }
.thumb.active { border-color: #c5694e; opacity: 1; }

@media (max-width: 1100px) {
  .thumbs { display: none; }
}
</style>
</head>
<body>

<div class="top-bar">
  <span class="brand">THE 7-LAYER PRIVACY STACK &middot; CALIFORNIA STUDENT DATA</span>
  <span class="meta">FRANK LUCIDO &middot; LUCIDO TECHNOLOGY CONSULTING</span>
</div>

<div class="stage">
  <div class="slide-frame" id="frame"></div>
</div>

<div class="thumbs" id="thumbs"></div>

<div class="nav-bar">
  <button class="nav-btn" id="prev-btn">&larr; PREV</button>
  <div class="nav-counter">SLIDE <strong id="cur">1</strong> / <strong id="total">14</strong></div>
  <button class="nav-btn" id="next-btn">NEXT &rarr;</button>
</div>

<script>
const TOTAL = 14;
let current = 1;

const frame = document.getElementById('frame');
const curEl = document.getElementById('cur');
const totalEl = document.getElementById('total');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const thumbsEl = document.getElementById('thumbs');

totalEl.textContent = TOTAL;

function pad(n) { return n.toString().padStart(2, '0'); }

function setSlide(n) {
  if (n < 1 || n > TOTAL) return;
  current = n;
  frame.innerHTML = `<iframe src="slides/slide-${pad(n)}.html"></iframe>`;
  curEl.textContent = n;
  prevBtn.disabled = n === 1;
  nextBtn.disabled = n === TOTAL;
  document.querySelectorAll('.thumb').forEach((el, idx) => {
    el.classList.toggle('active', idx + 1 === n);
  });
}

function initThumbs() {
  for (let i = 1; i <= TOTAL; i++) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url('screenshots/slide-${pad(i)}.png')`;
    div.title = `Slide ${i}`;
    div.addEventListener('click', () => setSlide(i));
    thumbsEl.appendChild(div);
  }
}

prevBtn.addEventListener('click', () => setSlide(current - 1));
nextBtn.addEventListener('click', () => setSlide(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault();
    setSlide(Math.min(current + 1, TOTAL));
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    setSlide(Math.max(current - 1, 1));
  } else if (e.key === 'Home') {
    setSlide(1);
  } else if (e.key === 'End') {
    setSlide(TOTAL);
  }
});

initThumbs();
setSlide(1);
</script>

</body>
</html>
